name: EXPA Sync

# Replaces the in-process node-cron scheduler, which cannot run on a serverless
# host because there is no long-lived process between requests. Each run calls
# the backend's /api/cron/* endpoints over HTTP instead.
#
# Required repository secrets:
#   BACKEND_URL  - deployed backend origin, no trailing slash
#                  (e.g. https://eps-tracking-api.vercel.app)
#   CRON_SECRET  - must match the CRON_SECRET env var set on the backend
#
# Note: GitHub disables scheduled workflows after 60 days without repo activity,
# and may delay runs under load. Swap in cron-job.org if timing gets strict.

on:
  schedule:
    # Leads: pages through EXPA for all three departments, so it is the
    # expensive one. Enrichment runs with it, immediately after.
    - cron: '*/30 * * * *'  # leads sync, every 30 minutes
    - cron: '0 * * * *'     # status/approvals sync, hourly
    # Enrichment on its own, filling in the details EXPA does not return.
    # It only reads the sign-up sheet and writes a handful of rows, so it
    # costs nothing to run often - and it is what decides how long a new
    # lead sits with a relay address and no phone number.
    - cron: '10,20,40,50 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: Which sync to run
        required: true
        default: sync-leads
        type: choice
        options: [sync-leads, sync-status, enrich-only]

concurrency:
  group: expa-sync-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Determine job
        id: pick
        run: |
          if [ "${{ github.event.schedule }}" = "0 * * * *" ]; then
            echo "job=sync-status" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10,20,40,50 * * * *" ]; then
            echo "job=enrich-only" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.job }}" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            echo "job=sync-leads" >> "$GITHUB_OUTPUT"
          fi

      # Skips rather than fails when the secrets are absent. On a 5-minute
      # schedule an unconfigured job would otherwise send a failure email every
      # 5 minutes, training everyone to ignore them.
      - name: Check configuration
        id: cfg
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::BACKEND_URL / CRON_SECRET not set - skipping sync."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # One request per product. The endpoint paginates EXPA for a whole
      # department, which can outlast a serverless request if all three run
      # together, so they are split and run sequentially.
      - name: Sync each department
        if: steps.cfg.outputs.ready == 'true' && steps.pick.outputs.job != 'enrich-only'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          set -u
          failed=0
          for product in GV GTA GTE; do
            echo "::group::$JOB $product"
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
              --max-time 120 --retry 2 --retry-delay 10 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BACKEND_URL/api/cron/$JOB?product=$product") || code=000
            echo "HTTP $code"
            cat /tmp/out.json 2>/dev/null || true
            echo
            [ "$code" = "200" ] || failed=1
            echo "::endgroup::"
          done
          exit $failed

      # Runs straight after the leads sync, because the two only make sense
      # together: the sync brings a person in from EXPA with a relay address
      # and no phone, and this fills both from the sign-up sheet. Left to run
      # separately, every freshly synced lead sat there with a blank Source and
      # an unusable email until someone triggered it by hand.
      #
      # Only after sync-leads — the hourly status sync adds no new people.
      # Hourly, alongside the status sync. Approvals change slowly — someone is
      # approved once — and this walks the committee's whole application list,
      # so running it every 5 minutes would be wasteful.
      - name: Sync approvals
        if: steps.cfg.outputs.ready == 'true' && steps.pick.outputs.job == 'sync-status'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          code=$(curl -sS -o /tmp/appr.json -w '%{http_code}' \
            --max-time 120 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BACKEND_URL/api/cron/sync-approvals") || code=000
          echo "HTTP $code"
          cat /tmp/appr.json 2>/dev/null || true
          echo
          [ "$code" = "200" ]

      - name: Enrich from the sign-up sheet
        if: >-
          steps.cfg.outputs.ready == 'true' &&
          (steps.pick.outputs.job == 'sync-leads' || steps.pick.outputs.job == 'enrich-only')
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          code=$(curl -sS -o /tmp/enrich.json -w '%{http_code}' \
            --max-time 120 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BACKEND_URL/api/cron/enrich-leads") || code=000
          echo "HTTP $code"
          cat /tmp/enrich.json 2>/dev/null || true
          echo
          [ "$code" = "200" ]
